services:
  saman-wellness-portal:
    build: .
    container_name: saman-wellness-portal
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # SQLite database persists here across rebuilds/redeploys.
      - saman_wellness_data:/app/data
    networks:
      - proxy_network
    # No ports published to the host — Nginx Proxy Manager reaches this
    # container directly over proxy_network by container name, same as
    # the rest of the v79 stack.

networks:
  proxy_network:
    external: true

volumes:
  saman_wellness_data:
